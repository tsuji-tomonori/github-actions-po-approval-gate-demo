name: Branch policy

on:
  pull_request_target:
    branches: [main, prd]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  checks: write
  issues: write

concurrency:
  group: branch-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  direction:
    name: Publish exact-SHA branch direction check
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate trusted branch metadata
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;
            const checkName = 'Validate branch direction';
            const externalId = `branch-direction:${pr.number}:${pr.head.sha}`;

            let conclusion = 'success';
            let title = 'Branch direction accepted';
            let summary = `${pr.head.ref} -> ${pr.base.ref} is an allowed Pull Request direction.`;

            if (!['main', 'prd'].includes(pr.base.ref)) {
              conclusion = 'failure';
              title = 'Unsupported target branch';
              summary = `Pull Requests may target only main or prd, not ${pr.base.ref}.`;
            } else if (pr.head.ref === 'prd') {
              conclusion = 'failure';
              title = 'Reverse release flow rejected';
              summary = 'The prd branch is deployment-only and must never be merged back into another branch.';
            }

            const listed = await github.rest.checks.listForRef({
              owner,
              repo,
              ref: pr.head.sha,
              check_name: checkName,
              per_page: 100,
            });
            const prior = listed.data.check_runs.find(
              run => run.external_id === externalId,
            );
            const common = {
              owner,
              repo,
              status: 'completed',
              conclusion,
              completed_at: new Date().toISOString(),
              details_url: pr.html_url,
              output: {
                title,
                summary: `${summary}\n\nHEAD SHA: ${pr.head.sha}`,
              },
            };

            if (prior) {
              await github.rest.checks.update({
                ...common,
                check_run_id: prior.id,
              });
            } else {
              await github.rest.checks.create({
                ...common,
                name: checkName,
                head_sha: pr.head.sha,
                external_id: externalId,
              });
            }

            if (conclusion === 'failure') {
              const marker = '<!-- branch-direction-policy -->';
              const body = `${marker}\n## Branch direction rejected\n\n` +
                `- Head: \`${pr.head.ref}\`\n` +
                `- Base: \`${pr.base.ref}\`\n` +
                `- HEAD SHA: \`${pr.head.sha}\`\n\n` +
                `${summary}\n\nCreate a change branch from \`main\`, then merge that branch into \`main\` or \`prd\`.`;
              const comments = await github.paginate(
                github.rest.issues.listComments,
                {owner, repo, issue_number: pr.number, per_page: 100},
              );
              const existing = comments.find(
                comment => comment.body && comment.body.includes(marker),
              );
              if (existing) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: pr.number,
                  body,
                });
              }
              core.setFailed(summary);
            }
