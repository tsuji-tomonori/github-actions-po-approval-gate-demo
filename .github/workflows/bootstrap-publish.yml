name: Publish repository source

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/chunks/**'
      - '.github/workflows/bootstrap-publish.yml'

permissions:
  contents: write

concurrency:
  group: publish-repository-source
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.actor == 'tsuji-tomonori' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Replace bootstrap tree with validated source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import base64
          import io
          import shutil
          import tarfile
          from pathlib import Path

          root = Path.cwd()
          chunks = sorted((root / '.bootstrap/chunks').glob('*.part'))
          if len(chunks) != 6:
              raise SystemExit(f'expected 6 payload chunks, found {len(chunks)}')
          encoded = ''.join(path.read_text(encoding='ascii') for path in chunks)
          archive = base64.b64decode(encoded, validate=True)
          for child in tuple(root.iterdir()):
              if child.name == '.git':
                  continue
              if child.is_dir():
                  shutil.rmtree(child)
              else:
                  child.unlink()
          with tarfile.open(fileobj=io.BytesIO(archive), mode='r:gz') as stream:
              stream.extractall(root, filter='data')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: implement PO approval gate verification'
          git push origin HEAD:main
