name: Observe PO approval gate

on:
  pull_request_target:
    branches: [prd]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  checks: read
  issues: write

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - name: Read and report the exact-SHA approval check
        uses: actions/github-script@v9
        with:
          script: |
            await new Promise(resolve => setTimeout(resolve, 20000));
            const pr = context.payload.pull_request;
            const listed = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: pr.head.sha,
              check_name: 'PO approval for PRD',
              per_page: 100,
            });
            const check = listed.data.check_runs
              .sort((a, b) => b.id - a.id)[0];
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const state = check
              ? `${check.status}${check.conclusion ? `/${check.conclusion}` : ''}`
              : 'missing';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: `<!-- po-approval-observation:${pr.head.sha} -->\nPO approval observation\n\n- HEAD SHA: \`${pr.head.sha}\`\n- Check state after 20 seconds: **${state}**\n- Observer run: ${runUrl}`,
            });
