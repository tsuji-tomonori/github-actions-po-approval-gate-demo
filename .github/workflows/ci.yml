name: CI

on:
  pull_request:
    branches: [main, prd]
  push:
    branches: [main, prd]

permissions:
  contents: read

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate repository contracts
        run: ./scripts/validate.sh
