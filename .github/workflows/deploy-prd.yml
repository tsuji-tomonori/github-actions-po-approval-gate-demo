name: Deploy production

on:
  push:
    branches: [prd]

permissions:
  contents: write
  pull-requests: read
  issues: write
  deployments: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  authorize:
    name: Verify merged PR provenance
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    outputs:
      pull-request-number: ${{ steps.provenance.outputs.pull-request-number }}
    steps:
      - id: provenance
        uses: actions/github-script@v9
        with:
          script: |
            let merged = [];
            for (let attempt = 1; attempt <= 6; attempt += 1) {
              const associated = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.sha,
                per_page: 100,
              });
              merged = associated.data
                .filter(pr => pr.merged_at && pr.base.ref === 'prd')
                .sort((a, b) => String(b.merged_at).localeCompare(String(a.merged_at)));
              if (merged.length > 0) break;
              if (attempt < 6) {
                await new Promise(resolve => setTimeout(resolve, 10000));
              }
            }
            if (merged.length === 0) {
              core.setFailed(`Commit ${context.sha} is not from a merged PR targeting prd.`);
              return;
            }
            core.setOutput('pull-request-number', String(merged[0].number));

  deploy:
    name: Deploy production
    needs: authorize
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Simulate production deployment
        env:
          SOURCE_PULL_REQUEST: ${{ needs.authorize.outputs.pull-request-number }}
        run: ./scripts/deploy-prd.sh
      - uses: actions/upload-artifact@v7
        with:
          name: production-deployment-${{ github.sha }}
          path: artifacts/deployment.json
          if-no-files-found: error
          retention-days: 30
      - name: Persist live validation evidence
        uses: actions/github-script@v9
        env:
          SOURCE_PULL_REQUEST: ${{ needs.authorize.outputs.pull-request-number }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = 'evidence/latest-deployment.json';
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const artifactName = `production-deployment-${context.sha}`;
            const evidence = {
              schema_version: 'production-deployment-validation/v1',
              repository: `${owner}/${repo}`,
              merge_sha: context.sha,
              source_pull_request: Number(process.env.SOURCE_PULL_REQUEST),
              workflow_run_id: String(context.runId),
              workflow_url: runUrl,
              artifact_name: artifactName,
              result: 'PASS',
              verified_at: new Date().toISOString(),
            };
            let currentSha;
            try {
              const current = await github.rest.repos.getContent({
                owner, repo, path, ref: 'prd',
              });
              currentSha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              branch: 'prd',
              message: 'chore: record deployment validation evidence [skip deploy]',
              content: Buffer.from(`${JSON.stringify(evidence, null, 2)}\n`).toString('base64'),
              ...(currentSha ? {sha: currentSha} : {}),
            });
      - name: Comment deployment evidence on the source PR
        continue-on-error: true
        uses: actions/github-script@v9
        env:
          SOURCE_PULL_REQUEST: ${{ needs.authorize.outputs.pull-request-number }}
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.SOURCE_PULL_REQUEST),
              body: `<!-- production-deployment-evidence -->\nProduction deployment simulation: **PASS**\n\n- Merge SHA: \`${context.sha}\`\n- Workflow run: ${runUrl}\n- Artifact: \`production-deployment-${context.sha}\``,
            });
